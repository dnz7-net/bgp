#
# =====================================================================
#  MODELO DE REFERENCIA - BGP DE BORDA (Huawei VRP8 / V800R021C10)
#  Cenario: 2 transitos + route servers de IX, dual-stack, sem clientes BGP
#
#  ATENCAO 1: todos os valores sao PLACEHOLDERS de documentacao
#  (RFC 5398 / 5737 / 3849). Eles COLIDEM com os proprios filtros de
#  bogon deste arquivo (ex.: AS 64500 cai em ASP-BOGON-ASN, 203.0.113.0/24
#  cai em PL-BOGONS-V4). Substitua TODOS antes de aplicar. Nunca aplique
#  este arquivo como esta.
#
#  ATENCAO 2: linhas iniciadas por "#" sao comentario. Se a sua release
#  reclamar ao colar, remova-as antes (ex.: grep -v '^#' arquivo.cfg).
#
#  Mapeamento placeholder -> ambiente real:
#    AS local ............ 64496            -> seu ASN
#    Transito A .......... AS 64500         -> upstream A (ex.: GIGA)
#      peer v4/v6 ........ 198.51.100.1 / 2001:DB8:A::1
#    Transito B .......... AS 64501         -> upstream B (ex.: K2)
#      peer v4/v6 ........ 198.51.100.5 / 2001:DB8:B::1
#    IX route servers .... AS 64502         -> PTT/IX.br
#      RS v4 ............. 192.0.2.1 / 192.0.2.2
#      RS v6 ............. 2001:DB8:100::1 / 2001:DB8:100::2
#    Agregado v4 ......... 203.0.113.0/24   -> seu bloco (e seus more-specifics de TE)
#    Agregado v6 ......... 2001:DB8::/32    -> seu bloco IPv6
#    Router-id ........... 10.255.255.1     -> sua Loopback0
#    ASN bloqueado ....... 64510            -> ASN barrado por politica comercial
#    Blackhole upstream A  64500:666        -> community RTBH documentada pelo upstream
#
#  Esquema de communities internas (documentar e manter):
#    64496:1000  aprendido do transito A
#    64496:1001  aprendido do transito B
#    64496:2000  aprendido do IX (route server)
#    64496:666   gatilho interno de blackhole (RTBH)
#  Com ASN de 4 bytes, o ideal e large community (asn:funcao:origem).
#  VALIDAR suporte na release: ip large-community-filter / apply large-community
# =====================================================================
#
#
# ---------------------------------------------------------------------
# 0. GLOBAL
# ---------------------------------------------------------------------
bfd
#
#
# ---------------------------------------------------------------------
# 1. LISTAS DE MATCH - PREFIXOS IPv4
# ---------------------------------------------------------------------
# Bogons IPv4: sempre "le 32" para pegar qualquer more-specific
ip ip-prefix PL-BOGONS-V4 index 10 permit 0.0.0.0 8 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 20 permit 10.0.0.0 8 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 30 permit 100.64.0.0 10 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 40 permit 127.0.0.0 8 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 50 permit 169.254.0.0 16 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 60 permit 172.16.0.0 12 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 70 permit 192.0.0.0 24 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 80 permit 192.0.2.0 24 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 90 permit 192.88.99.0 24 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 100 permit 192.168.0.0 16 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 110 permit 198.18.0.0 15 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 120 permit 198.51.100.0 24 less-equal 32
ip ip-prefix PL-BOGONS-V4 index 130 permit 203.0.113.0 24 less-equal 32
# 224.0.0.0/3 cobre multicast (224/4) e reservado (240/4)
ip ip-prefix PL-BOGONS-V4 index 140 permit 224.0.0.0 3 less-equal 32
#
# Prefixos proprios: anti-hijack no import (ninguem de fora anuncia o seu bloco)
ip ip-prefix PL-PROPRIOS-V4 index 10 permit 203.0.113.0 24 less-equal 32
#
# Tamanho aceito no import: /8 a /24
ip ip-prefix PL-TAMANHO-V4 index 10 permit 0.0.0.0 0 greater-equal 8 less-equal 24
#
# Export por peer: match EXATO (aqui entra a sua engenharia de trafego:
# agregado para um peer, more-specifics para outro)
ip ip-prefix PL-EXP-TRANSITO-A-V4 index 10 permit 203.0.113.0 24
ip ip-prefix PL-EXP-TRANSITO-B-V4 index 10 permit 203.0.113.0 24
ip ip-prefix PL-EXP-IX-V4 index 10 permit 203.0.113.0 24
#
# RTBH: so /32 dentro do proprio bloco
ip ip-prefix PL-BLACKHOLE-V4 index 10 permit 203.0.113.0 24 greater-equal 32 less-equal 32
#
#
# ---------------------------------------------------------------------
# 1b. LISTAS DE MATCH - PREFIXOS IPv6
# ---------------------------------------------------------------------
ip ipv6-prefix PL-BOGONS-V6 index 10 permit :: 8 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 20 permit 100:: 64 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 30 permit 2001:: 32 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 40 permit 2001:2:: 48 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 50 permit 2001:10:: 28 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 60 permit 2001:DB8:: 32 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 70 permit 2002:: 16 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 80 permit 3FFE:: 16 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 90 permit FC00:: 7 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 100 permit FE80:: 10 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 110 permit FEC0:: 10 less-equal 128
ip ipv6-prefix PL-BOGONS-V6 index 120 permit FF00:: 8 less-equal 128
#
ip ipv6-prefix PL-PROPRIOS-V6 index 10 permit 2001:DB8:: 32 less-equal 128
#
# Tamanho aceito: /12 a /48, e somente dentro de global unicast (2000::/3)
ip ipv6-prefix PL-TAMANHO-V6 index 10 permit 2000:: 3 greater-equal 12 less-equal 48
#
# Export: match EXATO (nunca "le 128")
ip ipv6-prefix PL-EXP-TRANSITO-A-V6 index 10 permit 2001:DB8:: 32
ip ipv6-prefix PL-EXP-TRANSITO-B-V6 index 10 permit 2001:DB8:: 32
ip ipv6-prefix PL-EXP-IX-V6 index 10 permit 2001:DB8:: 32
#
#
# ---------------------------------------------------------------------
# 2. LISTAS DE MATCH - AS-PATH  (sempre ancorar com "_", "^" ou "$")
# ---------------------------------------------------------------------
# Rota originada localmente (camada 2 do export)
ip as-path-filter ASP-LOCAL index 10 permit ^$
#
# Primeiro AS = o proprio upstream (compensa o "undo check-first-as" global)
ip as-path-filter ASP-FIRST-TRANSITO-A index 10 permit ^64500_
ip as-path-filter ASP-FIRST-TRANSITO-B index 10 permit ^64501_
#
# ASN barrado por politica comercial
ip as-path-filter ASP-DROP-POLITICA index 10 permit _64510_
#
# ASNs reservados/privados/documentacao (faixas IANA special-purpose)
ip as-path-filter ASP-BOGON-ASN index 10 permit _0_
ip as-path-filter ASP-BOGON-ASN index 20 permit _23456_
ip as-path-filter ASP-BOGON-ASN index 30 permit _(6449[6-9])_|_(6450[0-9])_|_(6451[0-1])_|_(6553[6-9])_|_(6554[0-9])_|_(6555[0-1])_
ip as-path-filter ASP-BOGON-ASN index 40 permit _6(4(5(1[2-9]|[2-9][0-9])|[6-9][0-9][0-9])|5([0-4][0-9][0-9]|5([0-2][0-9]|3[0-5])))_
ip as-path-filter ASP-BOGON-ASN index 50 permit _6555[2-9]_|_655[6-9][0-9]_|_65[6-9][0-9][0-9]_|_6[6-9][0-9][0-9][0-9]_
ip as-path-filter ASP-BOGON-ASN index 60 permit _[7-9][0-9][0-9][0-9][0-9]_|_1[0-2][0-9][0-9][0-9][0-9]_|_130[0-9][0-9][0-9]_
ip as-path-filter ASP-BOGON-ASN index 70 permit _1310[0-6][0-9]_|_13107[0-1]_
ip as-path-filter ASP-BOGON-ASN index 80 permit _42[0-8][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_
ip as-path-filter ASP-BOGON-ASN index 90 permit _(429[0-3][0-9][0-9][0-9][0-9][0-9][0-9])_|_(4294[0-8][0-9][0-9][0-9][0-9][0-9])_
ip as-path-filter ASP-BOGON-ASN index 100 permit _(42949[0-5][0-9][0-9][0-9][0-9])_|_(429496[0-6][0-9][0-9][0-9])_
ip as-path-filter ASP-BOGON-ASN index 110 permit _(4294967[0-1][0-9][0-9])_|_(42949672[0-8][0-9])_|_(429496729[0-5])_
#
#
# ---------------------------------------------------------------------
# 3. LISTAS DE MATCH - COMMUNITIES
# ---------------------------------------------------------------------
# Tags de origem (marcadas no import). Indices separados = OR
ip community-filter basic CF-APRENDIDO-EXTERNO index 10 permit 64496:1000
ip community-filter basic CF-APRENDIDO-EXTERNO index 20 permit 64496:1001
ip community-filter basic CF-APRENDIDO-EXTERNO index 30 permit 64496:2000
#
# Gatilho interno de blackhole
ip community-filter basic CF-BLACKHOLE-INTERNO index 10 permit 64496:666
#
# Qualquer community no proprio namespace: apagada no import
# (impede o peer de injetar tag de TE ou de blackhole sua)
# VALIDAR: uso de filtro advanced em "apply comm-filter ... delete"
ip community-filter advanced CF-NAMESPACE-PROPRIO index 10 permit ^64496:
#
#
# ---------------------------------------------------------------------
# 4. FILTROS - ROUTE-POLICY
#    Ordem padrao do import:
#      deny bogons -> deny proprios -> deny ASN bogon -> deny politica
#      -> limpa communities (goto next-node) -> permit com criterios -> deny 999
#    Ordem padrao do export:
#      deny aprendido externo -> [RTBH] -> permit proprio + ^$ -> deny 999
# ---------------------------------------------------------------------
route-policy RP-DENY-ALL deny node 10
 description DENY-ALL-PARA-PEER-NOVO
#
# Marca o /32 de blackhole na originacao (usado so sob demanda)
route-policy RP-SET-BLACKHOLE permit node 10
 description MARCA-GATILHO-RTBH
 apply community 64496:666
#
# ======================== TRANSITO A - IPv4 ==========================
route-policy RP-TRANSITO-A-IN-V4 deny node 10
 description DENY-BOGONS
 if-match ip-prefix PL-BOGONS-V4
route-policy RP-TRANSITO-A-IN-V4 deny node 20
 description DENY-PREFIXOS-PROPRIOS
 if-match ip-prefix PL-PROPRIOS-V4
route-policy RP-TRANSITO-A-IN-V4 deny node 30
 description DENY-ASN-BOGON
 if-match as-path-filter ASP-BOGON-ASN
route-policy RP-TRANSITO-A-IN-V4 deny node 40
 description DENY-POLITICA
 if-match as-path-filter ASP-DROP-POLITICA
# no sem if-match = casa tudo; goto garante que a limpeza ocorre ANTES da tag
# VALIDAR: comportamento de goto next-node na release
route-policy RP-TRANSITO-A-IN-V4 permit node 50
 description LIMPA-NAMESPACE-PROPRIO
 apply comm-filter CF-NAMESPACE-PROPRIO delete
 goto next-node
route-policy RP-TRANSITO-A-IN-V4 permit node 60
 description ACEITA-TRANSITO-A
 if-match ip-prefix PL-TAMANHO-V4
 if-match as-path-filter ASP-FIRST-TRANSITO-A
 apply local-preference 200
 apply community 64496:1000 additive
route-policy RP-TRANSITO-A-IN-V4 deny node 999
 description DENY-EXPLICITO
#
route-policy RP-TRANSITO-A-OUT-V4 deny node 10
 description DENY-APRENDIDO-EXTERNO
 if-match community-filter CF-APRENDIDO-EXTERNO
route-policy RP-TRANSITO-A-OUT-V4 permit node 15
 description RTBH-PARA-UPSTREAM-A
 if-match ip-prefix PL-BLACKHOLE-V4
 if-match community-filter CF-BLACKHOLE-INTERNO
 if-match as-path-filter ASP-LOCAL
# sem additive: substitui tudo pela community RTBH do upstream
 apply community 64500:666 no-export
route-policy RP-TRANSITO-A-OUT-V4 permit node 20
 description ANUNCIA-PROPRIOS
 if-match ip-prefix PL-EXP-TRANSITO-A-V4
 if-match as-path-filter ASP-LOCAL
 apply community none
route-policy RP-TRANSITO-A-OUT-V4 deny node 999
 description DENY-EXPLICITO
#
# ======================== TRANSITO A - IPv6 ==========================
route-policy RP-TRANSITO-A-IN-V6 deny node 10
 description DENY-BOGONS
 if-match ipv6 address prefix-list PL-BOGONS-V6
route-policy RP-TRANSITO-A-IN-V6 deny node 20
 description DENY-PREFIXOS-PROPRIOS
 if-match ipv6 address prefix-list PL-PROPRIOS-V6
route-policy RP-TRANSITO-A-IN-V6 deny node 30
 description DENY-ASN-BOGON
 if-match as-path-filter ASP-BOGON-ASN
route-policy RP-TRANSITO-A-IN-V6 deny node 40
 description DENY-POLITICA
 if-match as-path-filter ASP-DROP-POLITICA
route-policy RP-TRANSITO-A-IN-V6 permit node 50
 description LIMPA-NAMESPACE-PROPRIO
 apply comm-filter CF-NAMESPACE-PROPRIO delete
 goto next-node
route-policy RP-TRANSITO-A-IN-V6 permit node 60
 description ACEITA-TRANSITO-A
 if-match ipv6 address prefix-list PL-TAMANHO-V6
 if-match as-path-filter ASP-FIRST-TRANSITO-A
 apply local-preference 200
 apply community 64496:1000 additive
route-policy RP-TRANSITO-A-IN-V6 deny node 999
 description DENY-EXPLICITO
#
route-policy RP-TRANSITO-A-OUT-V6 deny node 10
 description DENY-APRENDIDO-EXTERNO
 if-match community-filter CF-APRENDIDO-EXTERNO
route-policy RP-TRANSITO-A-OUT-V6 permit node 20
 description ANUNCIA-PROPRIOS
 if-match ipv6 address prefix-list PL-EXP-TRANSITO-A-V6
 if-match as-path-filter ASP-LOCAL
 apply community none
route-policy RP-TRANSITO-A-OUT-V6 deny node 999
 description DENY-EXPLICITO
#
# ======================== TRANSITO B - IPv4 ==========================
route-policy RP-TRANSITO-B-IN-V4 deny node 10
 description DENY-BOGONS
 if-match ip-prefix PL-BOGONS-V4
route-policy RP-TRANSITO-B-IN-V4 deny node 20
 description DENY-PREFIXOS-PROPRIOS
 if-match ip-prefix PL-PROPRIOS-V4
route-policy RP-TRANSITO-B-IN-V4 deny node 30
 description DENY-ASN-BOGON
 if-match as-path-filter ASP-BOGON-ASN
route-policy RP-TRANSITO-B-IN-V4 deny node 40
 description DENY-POLITICA
 if-match as-path-filter ASP-DROP-POLITICA
route-policy RP-TRANSITO-B-IN-V4 permit node 50
 description LIMPA-NAMESPACE-PROPRIO
 apply comm-filter CF-NAMESPACE-PROPRIO delete
 goto next-node
route-policy RP-TRANSITO-B-IN-V4 permit node 60
 description ACEITA-TRANSITO-B
 if-match ip-prefix PL-TAMANHO-V4
 if-match as-path-filter ASP-FIRST-TRANSITO-B
 apply local-preference 200
 apply community 64496:1001 additive
route-policy RP-TRANSITO-B-IN-V4 deny node 999
 description DENY-EXPLICITO
#
route-policy RP-TRANSITO-B-OUT-V4 deny node 10
 description DENY-APRENDIDO-EXTERNO
 if-match community-filter CF-APRENDIDO-EXTERNO
route-policy RP-TRANSITO-B-OUT-V4 permit node 20
 description ANUNCIA-PROPRIOS
 if-match ip-prefix PL-EXP-TRANSITO-B-V4
 if-match as-path-filter ASP-LOCAL
# community de TE documentada pelo upstream B (sem additive = substitui)
 apply community 64501:100
route-policy RP-TRANSITO-B-OUT-V4 deny node 999
 description DENY-EXPLICITO
#
# ======================== TRANSITO B - IPv6 ==========================
route-policy RP-TRANSITO-B-IN-V6 deny node 10
 description DENY-BOGONS
 if-match ipv6 address prefix-list PL-BOGONS-V6
route-policy RP-TRANSITO-B-IN-V6 deny node 20
 description DENY-PREFIXOS-PROPRIOS
 if-match ipv6 address prefix-list PL-PROPRIOS-V6
route-policy RP-TRANSITO-B-IN-V6 deny node 30
 description DENY-ASN-BOGON
 if-match as-path-filter ASP-BOGON-ASN
route-policy RP-TRANSITO-B-IN-V6 deny node 40
 description DENY-POLITICA
 if-match as-path-filter ASP-DROP-POLITICA
route-policy RP-TRANSITO-B-IN-V6 permit node 50
 description LIMPA-NAMESPACE-PROPRIO
 apply comm-filter CF-NAMESPACE-PROPRIO delete
 goto next-node
route-policy RP-TRANSITO-B-IN-V6 permit node 60
 description ACEITA-TRANSITO-B
 if-match ipv6 address prefix-list PL-TAMANHO-V6
 if-match as-path-filter ASP-FIRST-TRANSITO-B
 apply local-preference 200
 apply community 64496:1001 additive
route-policy RP-TRANSITO-B-IN-V6 deny node 999
 description DENY-EXPLICITO
#
route-policy RP-TRANSITO-B-OUT-V6 deny node 10
 description DENY-APRENDIDO-EXTERNO
 if-match community-filter CF-APRENDIDO-EXTERNO
route-policy RP-TRANSITO-B-OUT-V6 permit node 20
 description ANUNCIA-PROPRIOS
 if-match ipv6 address prefix-list PL-EXP-TRANSITO-B-V6
 if-match as-path-filter ASP-LOCAL
 apply community none
route-policy RP-TRANSITO-B-OUT-V6 deny node 999
 description DENY-EXPLICITO
#
# ===================== IX ROUTE SERVER - IPv4 ========================
# Sem checagem de primeiro AS: route server nao insere o proprio ASN
route-policy RP-IX-RS-IN-V4 deny node 10
 description DENY-BOGONS
 if-match ip-prefix PL-BOGONS-V4
route-policy RP-IX-RS-IN-V4 deny node 20
 description DENY-PREFIXOS-PROPRIOS
 if-match ip-prefix PL-PROPRIOS-V4
route-policy RP-IX-RS-IN-V4 deny node 30
 description DENY-ASN-BOGON
 if-match as-path-filter ASP-BOGON-ASN
route-policy RP-IX-RS-IN-V4 deny node 40
 description DENY-POLITICA
 if-match as-path-filter ASP-DROP-POLITICA
route-policy RP-IX-RS-IN-V4 permit node 50
 description LIMPA-NAMESPACE-PROPRIO
 apply comm-filter CF-NAMESPACE-PROPRIO delete
 goto next-node
route-policy RP-IX-RS-IN-V4 permit node 60
 description ACEITA-IX
 if-match ip-prefix PL-TAMANHO-V4
# IX preferido sobre transito
 apply local-preference 300
 apply community 64496:2000 additive
route-policy RP-IX-RS-IN-V4 deny node 999
 description DENY-EXPLICITO
#
route-policy RP-IX-RS-OUT-V4 deny node 10
 description DENY-APRENDIDO-EXTERNO
 if-match community-filter CF-APRENDIDO-EXTERNO
route-policy RP-IX-RS-OUT-V4 permit node 20
 description ANUNCIA-PROPRIOS
 if-match ip-prefix PL-EXP-IX-V4
 if-match as-path-filter ASP-LOCAL
 apply community none
# Communities de acao do route server (ex.: nao anunciar a um ASN):
# VALIDAR na documentacao do IX antes de usar
route-policy RP-IX-RS-OUT-V4 deny node 999
 description DENY-EXPLICITO
#
# ===================== IX ROUTE SERVER - IPv6 ========================
route-policy RP-IX-RS-IN-V6 deny node 10
 description DENY-BOGONS
 if-match ipv6 address prefix-list PL-BOGONS-V6
route-policy RP-IX-RS-IN-V6 deny node 20
 description DENY-PREFIXOS-PROPRIOS
 if-match ipv6 address prefix-list PL-PROPRIOS-V6
route-policy RP-IX-RS-IN-V6 deny node 30
 description DENY-ASN-BOGON
 if-match as-path-filter ASP-BOGON-ASN
route-policy RP-IX-RS-IN-V6 deny node 40
 description DENY-POLITICA
 if-match as-path-filter ASP-DROP-POLITICA
route-policy RP-IX-RS-IN-V6 permit node 50
 description LIMPA-NAMESPACE-PROPRIO
 apply comm-filter CF-NAMESPACE-PROPRIO delete
 goto next-node
route-policy RP-IX-RS-IN-V6 permit node 60
 description ACEITA-IX
 if-match ipv6 address prefix-list PL-TAMANHO-V6
 apply local-preference 300
 apply community 64496:2000 additive
route-policy RP-IX-RS-IN-V6 deny node 999
 description DENY-EXPLICITO
#
route-policy RP-IX-RS-OUT-V6 deny node 10
 description DENY-APRENDIDO-EXTERNO
 if-match community-filter CF-APRENDIDO-EXTERNO
route-policy RP-IX-RS-OUT-V6 permit node 20
 description ANUNCIA-PROPRIOS
 if-match ipv6 address prefix-list PL-EXP-IX-V6
 if-match as-path-filter ASP-LOCAL
 apply community none
route-policy RP-IX-RS-OUT-V6 deny node 999
 description DENY-EXPLICITO
#
#
# ---------------------------------------------------------------------
# 5. ANCORAS DE ORIGINACAO (NULL0) - o "network" so anuncia o que existe na RIB
# ---------------------------------------------------------------------
ip route-static 203.0.113.0 255.255.255.0 NULL0 description ANCORA-BGP-AGREGADO-V4
ipv6 route-static 2001:DB8:: 32 NULL0 description ANCORA-BGP-AGREGADO-V6
#
# RTBH sob demanda (descomentar no incidente; o /32 e o IP atacado):
# ip route-static 203.0.113.10 255.255.255.255 NULL0 description RTBH-ALVO
#
#
# ---------------------------------------------------------------------
# 6. BGP - PEERS (camada de sessao)
#    - BFD e GTSM (valid-ttl-hops) so se o outro lado tambem configurar
#    - timer/password/GTSM em sessao JA estabelecida podem resetar o peer
#    - password: combinar com o upstream; nunca versionar em claro
# ---------------------------------------------------------------------
bgp 64496
 router-id 10.255.255.1
 graceful-restart
# necessario para route server de IX (RS nao insere o proprio ASN);
# a checagem de primeiro AS dos transitos e feita por ASP-FIRST-*
 undo check-first-as
#
# --- Transito A ---
 peer 198.51.100.1 as-number 64500
 peer 198.51.100.1 description TRANSITO-A-V4
 peer 198.51.100.1 timer keepalive 10 hold 30
 peer 198.51.100.1 bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 peer 198.51.100.1 bfd enable
 peer 198.51.100.1 valid-ttl-hops 1
# peer 198.51.100.1 password cipher <DEFINIR-COM-UPSTREAM>
 peer 2001:DB8:A::1 as-number 64500
 peer 2001:DB8:A::1 description TRANSITO-A-V6
 peer 2001:DB8:A::1 timer keepalive 10 hold 30
 peer 2001:DB8:A::1 bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 peer 2001:DB8:A::1 bfd enable
 peer 2001:DB8:A::1 valid-ttl-hops 1
#
# --- Transito B ---
 peer 198.51.100.5 as-number 64501
 peer 198.51.100.5 description TRANSITO-B-V4
 peer 198.51.100.5 timer keepalive 10 hold 30
 peer 198.51.100.5 bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 peer 198.51.100.5 bfd enable
 peer 198.51.100.5 valid-ttl-hops 1
 peer 2001:DB8:B::1 as-number 64501
 peer 2001:DB8:B::1 description TRANSITO-B-V6
 peer 2001:DB8:B::1 timer keepalive 10 hold 30
 peer 2001:DB8:B::1 bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 peer 2001:DB8:B::1 bfd enable
 peer 2001:DB8:B::1 valid-ttl-hops 1
#
# --- IX route servers (peer-group: mesma politica, sem drift entre RS01/RS02) ---
 group IX-RS-V4 external
 peer IX-RS-V4 as-number 64502
 peer 192.0.2.1 group IX-RS-V4
 peer 192.0.2.1 description IX-RS01-V4
 peer 192.0.2.2 group IX-RS-V4
 peer 192.0.2.2 description IX-RS02-V4
 group IX-RS-V6 external
 peer IX-RS-V6 as-number 64502
 peer 2001:DB8:100::1 group IX-RS-V6
 peer 2001:DB8:100::1 description IX-RS01-V6
 peer 2001:DB8:100::2 group IX-RS-V6
 peer 2001:DB8:100::2 description IX-RS02-V6
#
# ---------------------------------------------------------------------
# 7. BGP - APLICACAO DOS FILTROS POR ADDRESS-FAMILY
#    route-limit: transito com alert-only (nao derrubar full table);
#                 IX com idle-timeout (protege contra leak em massa)
#    Ajuste os limites ao volume real da tabela.
# ---------------------------------------------------------------------
 ipv4-family unicast
  undo synchronization
